# =============================================================================
# Rule Severity Mapping
# =============================================================================
# Maps Checkstyle / PMD / SpotBugs checks to severity levels for reporting and
# CI/CD decisions.
#
# Severity Levels:
#   - critical: Block merge, must fix immediately (potential crashes/security)
#   - major: Requires review, should fix before release (potential bugs)
#   - minor: Style/preference, fix when convenient (maintainability)
#
# Tooling:
#   - Checkstyle  -> formatting, naming, braces (was clang-format)
#   - PMD         -> source-level bug / style / security analysis (was clang-tidy)
#   - SpotBugs    -> bytecode-level bug / security analysis (was clang-tidy)
#
# Usage:
#   - CI/CD and scripts/validate.sh parse this file to determine pass/fail criteria
#   - Windsurf rules reference these rule IDs
#   - Reports can group issues by severity
# =============================================================================

version: "1.0"
last_updated: "2026-06-18"

severity_levels:

  # ===========================================================================
  # CRITICAL - Block merge, potential safety/security issues
  # ===========================================================================
  critical:
    description: "Must fix before merge - safety or security risk"
    action: "block_merge"
    exit_code: 1
    rules:

      - rule_id: "Rule 20"
        name: "Check all return values"
        rationale: "Unchecked return values hide failures, leading to undefined behavior"
        checks:
          - "SpotBugs: RV_RETURN_VALUE_IGNORED_BAD_PRACTICE"
          - "SpotBugs: RV_RETURN_VALUE_IGNORED_NO_SIDE_EFFECT"
          - "PMD: CheckResultSet"
        examples:
          bad: "new File(\"data.txt\").delete();"
          good: "if (!new File(\"data.txt\").delete()) { throw new IOException(\"delete failed\"); }"

      - rule_id: "Rule 21"
        name: "Prevent injection vulnerabilities"
        rationale: "Untrusted input flowing into SQL, OS commands or format strings is the #1 source of security vulnerabilities"
        checks:
          - "SpotBugs: SQL_INJECTION_JDBC"
          - "SpotBugs: SQL_INJECTION_PREPARED_STATEMENT"
          - "SpotBugs: COMMAND_INJECTION"
          - "SpotBugs: FORMAT_STRING_MANIPULATION"
        examples:
          bad: "stmt.executeQuery(\"SELECT * FROM users WHERE id = \" + userId);"
          good: "PreparedStatement ps = conn.prepareStatement(\"SELECT * FROM users WHERE id = ?\"); ps.setInt(1, userId);"

      - rule_id: "Rule 22"
        name: "Prevent null pointer dereference"
        rationale: "Null dereference causes crashes and can be exploited for DoS"
        checks:
          - "SpotBugs: NP_NULL_ON_SOME_PATH"
          - "SpotBugs: NP_NULL_PARAM_DEREF"
          - "SpotBugs: NP_ALWAYS_NULL"
          - "PMD: BrokenNullCheck"
        examples:
          bad: "int len = name.length();"
          good: "if (name != null) { int len = name.length(); }"

      - rule_id: "Rule 23"
        name: "Prevent resource leaks"
        rationale: "Unclosed streams and connections degrade performance and can crash long-running systems"
        checks:
          - "PMD: CloseResource"
          - "PMD: EmptyCatchBlock"
          - "SpotBugs: OBL_UNSATISFIED_OBLIGATION"
          - "SpotBugs: OS_OPEN_STREAM"
        examples:
          bad: "InputStream in = new FileInputStream(f); in.read();"
          good: "try (InputStream in = new FileInputStream(f)) { in.read(); }"

      - rule_id: "Rule 24"
        name: "Prevent leaking internal references"
        rationale: "Exposing internal mutable state (arrays/collections) lets callers corrupt object invariants (CWE-374/375)"
        checks:
          - "SpotBugs: EI_EXPOSE_REP"
          - "SpotBugs: EI_EXPOSE_REP2"
          - "PMD: MethodReturnsInternalArray"
          - "PMD: ArrayIsStoredDirectly"
        examples:
          bad: "public int[] getValues() { return this.values; }"
          good: "public int[] getValues() { return this.values.clone(); }"

      - rule_id: "Rule 25"
        name: "Avoid dead stores and unwritten state"
        rationale: "Dead local stores and never-written fields signal logic errors and reads of default/garbage values"
        checks:
          - "SpotBugs: DLS_DEAD_LOCAL_STORE"
          - "SpotBugs: UWF_UNWRITTEN_FIELD"
          - "SpotBugs: NP_UNWRITTEN_FIELD"
          - "PMD: UnusedAssignment"
        examples:
          bad: "int result = compute(); result = 0; return result;"
          good: "int result = compute(); return result;"

      - rule_id: "Rule 26"
        name: "Avoid insecure APIs"
        rationale: "Predictable randomness and weak/obsolete cryptography lead to exploitable vulnerabilities"
        checks:
          - "SpotBugs: PREDICTABLE_RANDOM"
          - "SpotBugs: WEAK_MESSAGE_DIGEST_MD5"
          - "SpotBugs: DES_USAGE"
          - "PMD: InsecureCryptoIv"
          - "PMD: HardCodedCryptoKey"
        examples:
          bad: "int token = new java.util.Random().nextInt();"
          good: "int token = java.security.SecureRandom.getInstanceStrong().nextInt();"

  # ===========================================================================
  # MAJOR - Requires review, potential bugs
  # ===========================================================================
  major:
    description: "Requires review - potential bugs or quality issues"
    action: "require_review"
    exit_code: 0
    rules:

      - rule_id: "Rule 30"
        name: "Avoid narrowing conversions"
        rationale: "Implicit narrowing can silently truncate data causing subtle bugs"
        checks:
          - "SpotBugs: ICAST_INTEGER_MULTIPLY_CAST_TO_LONG"
          - "SpotBugs: ICAST_IDIV_CAST_TO_DOUBLE"
          - "PMD: AvoidUsingShortType"
        examples:
          bad: "long ms = 24 * 60 * 60 * 1000 * days;"
          good: "long ms = 24L * 60 * 60 * 1000 * days;"

      - rule_id: "Rule 31"
        name: "Avoid confusing method overloads"
        rationale: "Scattered or inconsistently named overloads make APIs hard to read and misuse-prone"
        checks:
          - "Checkstyle: OverloadMethodsDeclarationOrder"
          - "SpotBugs: NM_METHOD_NAMING_CONVENTION"
          - "SpotBugs: NM_CONFUSING"
        examples:
          bad: "void add(int x){} void remove(int x){} void add(String s){}"
          good: "void add(int x){} void add(String s){} void remove(int x){}"

      - rule_id: "Rule 32"
        name: "Avoid redundant code"
        rationale: "Redundant code indicates logic errors or copy-paste mistakes"
        checks:
          - "PMD: UnnecessaryReturn"
          - "PMD: EmptyControlStatement"
          - "PMD: UselessParentheses"
          - "SpotBugs: RpC_REPEATED_CONDITIONAL_TEST"
          - "SpotBugs: DB_DUPLICATE_BRANCHES"
        examples:
          bad: "if (x > 0) { return 1; } else if (x > 0) { return 2; }"
          good: "if (x > 0) { return 1; } else if (x < 0) { return 2; }"

      - rule_id: "Rule 33"
        name: "Prevent infinite loops"
        rationale: "Infinite loops and unbounded recursion cause hangs and denial of service"
        checks:
          - "SpotBugs: IL_INFINITE_LOOP"
          - "SpotBugs: IL_INFINITE_RECURSIVE_LOOP"
        examples:
          bad: "while (true) { if (done) { continue; } }"
          good: "while (!done) { process(); }"

      - rule_id: "Rule 34"
        name: "Thread safety"
        rationale: "Inconsistent synchronization and broken double-checked locking cause data races in concurrent code"
        checks:
          - "SpotBugs: IS2_INCONSISTENT_SYNC"
          - "SpotBugs: DC_DOUBLECHECK"
          - "PMD: DoubleCheckedLocking"
          - "PMD: NonThreadSafeSingleton"
        examples:
          bad: "if (instance == null) { instance = new Service(); }"
          good: "synchronized (lock) { if (instance == null) { instance = new Service(); } }"

      - rule_id: "Rule 35"
        name: "Performance issues"
        rationale: "Unnecessary allocations and string concatenation in loops waste CPU and memory"
        checks:
          - "PMD: AvoidInstantiatingObjectsInLoops"
          - "PMD: UseStringBufferForStringAppends"
          - "SpotBugs: SBSC_USE_STRINGBUFFER_CONCATENATION"
        examples:
          bad: "String s = \"\"; for (String p : parts) { s += p; }"
          good: "StringBuilder sb = new StringBuilder(); for (String p : parts) { sb.append(p); }"

  # ===========================================================================
  # MINOR - Style/maintainability warnings
  # ===========================================================================
  minor:
    description: "Style or maintainability - fix when convenient"
    action: "warn_only"
    exit_code: 0
    rules:

      - rule_id: "Rule 40"
        name: "Consistent formatting"
        rationale: "Consistent style improves readability and reduces merge conflicts"
        checks:
          - "Checkstyle: LeftCurly (option eol - Java standard brace style)"
          - "Checkstyle: RightCurly"
        enforced_by: "checkstyle.xml"

      - rule_id: "Rule 41"
        name: "Naming conventions"
        rationale: "Consistent naming makes code more predictable and searchable"
        checks:
          - "Checkstyle: MethodName"
          - "Checkstyle: MemberName"
          - "Checkstyle: LocalVariableName"
          - "Checkstyle: ParameterName"
          - "Checkstyle: ConstantName"
          - "Checkstyle: TypeName"
          - "Checkstyle: PackageName"
        conventions:
          methods: "lowerCamelCase"
          variables: "lowerCamelCase"
          constants: "UPPER_SNAKE_CASE"
          types: "UpperCamelCase"
          packages: "lower.case.dotted"

      - rule_id: "Rule 42"
        name: "Always use braces"
        rationale: "Braces prevent bugs when adding statements to conditionals/loops"
        checks:
          - "Checkstyle: NeedBraces"
        examples:
          bad: "if (error) return -1;"
          good: "if (error) { return -1; }"

      - rule_id: "Rule 43"
        name: "Simplify boolean expressions"
        rationale: "Complex boolean expressions are error-prone and hard to read"
        checks:
          - "Checkstyle: SimplifyBooleanExpression"
          - "Checkstyle: SimplifyBooleanReturn"
        examples:
          bad: "if (flag == true) { return true; } else { return false; }"
          good: "return flag;"

      - rule_id: "Rule 44"
        name: "Avoid else after return"
        rationale: "Unnecessary else after return increases indentation"
        checks:
          - "advisory: no automated check (review guideline only)"
        examples:
          bad: "if (error) { return -1; } else { process(); }"
          good: "if (error) { return -1; } process();"

      - rule_id: "Rule 45"
        name: "Avoid returning null"
        rationale: "Returning null for arrays/collections forces null checks on every caller and invites NPEs"
        checks:
          - "SpotBugs: PZLA_PREFER_ZERO_LENGTH_ARRAYS"
          - "PMD: ReturnEmptyArrayRatherThanNull"
        examples:
          bad: "int[] getValues() { if (empty) { return null; } return data; }"
          good: "int[] getValues() { if (empty) { return new int[0]; } return data; }"

      - rule_id: "Rule 46"
        name: "Remove unused parameters"
        rationale: "Unused parameters, fields and locals indicate dead code or missing implementation"
        checks:
          - "PMD: UnusedFormalParameter (checkAll=true)"
          - "PMD: UnusedPrivateField"
          - "PMD: UnusedLocalVariable"
        examples:
          bad: "int process(int x, int unused) { return x; }"
          good: "int process(int x) { return x; }"

# =============================================================================
# SUPPRESSION GUIDANCE
# =============================================================================
# Replaces the C/C++ NOLINT family with the Java suppression syntax for each tool.
suppression:
  checkstyle:
    inline_off: "// CHECKSTYLE:OFF"
    inline_on: "// CHECKSTYLE:ON"
    annotation: "@SuppressWarnings(\"checkstyle:RuleName\")"
  pmd:
    annotation: "@SuppressWarnings(\"PMD.RuleName\")"
    inline: "// NOPMD - reason"
  spotbugs:
    annotation: "@SuppressFBWarnings(value = \"BUG_PATTERN\", justification = \"reason\")"
    filter_file: "spotbugs-exclude.xml"
  notes:
    - "Always add a comment/justification explaining why the suppression is needed"
    - "Prefer fixing the issue over suppressing it"
    - "Suppressions should be reviewed in code review"
    - "@SuppressFBWarnings requires the com.github.spotbugs:spotbugs-annotations dependency (provided scope)"
